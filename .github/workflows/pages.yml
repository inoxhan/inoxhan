# gh-pages dalindaki hazir statik ciktiyi (npm run derle:statik -> out/) GitHub Pages'e dagitir.
#
# github-pages ortaminin koruma kurali yalnizca main dalindan dagitima izin verdigi
# icin is akisi main'de yasar, icerigi gh-pages dalindan checkout eder.
# Ilk basarili calisma Pages kaynagini "GitHub Actions" moduna cevirir — boylece
# main'deki README degil, gh-pages'teki site yayinlanir.
#
# Yeni dagitim: gh-pages dalini guncelledikten sonra main'e herhangi bir push
# ya da Actions sekmesinden elle "Run workflow".
name: GitHub Pages yayini

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # Pages kaynagi ayarlarda hala "Deploy from a branch" oldugu surece ayni push,
      # README'yi yayinlayan eski tip "pages build and deployment" isini de tetikler
      # ve o is ~1 dk icinde bitip bizim dagitimimizin ustune yazar. Bekleyip son
      # dagitimin bu is akisindan cikmasini garantiliyoruz. Ayarlar > Pages >
      # Source: "GitHub Actions" secilirse eski is devre disi kalir; bekleme zararsizlasir.
      - run: sleep 150
      - id: deployment
        uses: actions/deploy-pages@v4
